<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dentee | All-in-One Dental Clinic Management System</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Dental Practice Management — Pro & Premium plans with Patient Records, Appointments, Treatment Plans, GST Billing, Insurance, Tooth Chart, AI, and more.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/glassmorphism.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-layout">
    
    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="app.toggleMobileSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">🦷</div>
        <div>
          <div class="brand-name">Dentee</div>
          <div style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">CLINIC OS</div>
        </div>
        <div class="brand-tag brand-tag-premium" id="brand-tag">PREMIUM</div>
      </div>

      <!-- Favorites Section -->
      <div id="sidebar-favorites" style="padding:0.5rem 0.75rem; border-bottom:1px solid var(--border-color); flex-shrink:0;">
        <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px; margin-bottom:0.35rem;">⭐ Favorites</div>
        <div id="favorites-list" style="display:flex; flex-direction:column; gap:2px;"></div>
      </div>

      <!-- Recent Patients Section -->
      <div id="sidebar-recent" style="padding:0.5rem 0.75rem; border-bottom:1px solid var(--border-color); flex-shrink:0;">
        <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px; margin-bottom:0.35rem;">📌 Recent Patients</div>
        <div id="recent-patients-list" style="display:flex; flex-direction:column; gap:2px;"></div>
      </div>

      <nav class="sidebar-menu" id="sidebar-menu">
        <!-- Rendered dynamically by app.js from planConfig.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="doctor-profile-card">
          <div class="doctor-avatar">SJ</div>
          <div class="doctor-info">
            <div class="doctor-name">Dr. S. Jenkins</div>
            <div class="doctor-role">Chief Dental Surgeon</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      
      <header class="top-header">
        <div class="header-left">
          <!-- Mobile Hamburger -->
          <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="app.toggleMobileSidebar()" title="Menu">☰</button>

          <div class="patient-quick-select" onclick="app.navigateTo('patients')">
            <span>👤 Active Patient:</span>
            <span id="active-patient-name">Sophia Martinez (P-1001)</span>
            <span style="font-size:0.7rem;">▼</span>
          </div>

          <div style="margin-left:1rem; display:inline-block;">
            <select class="form-control" style="padding:4px 8px; font-size:0.8rem; background:var(--bg-surface); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px;" onchange="app.showToast('Active Clinic Context: ' + this.options[this.selectedIndex].text)">
              <option value="BR-01">🏥 Beverly Hills Central (HQ)</option>
              <option value="BR-02">🏥 Westside Implant & Ortho</option>
              <option value="BR-03">🏥 Downtown Smile Hub</option>
            </select>
          </div>

        <div class="header-right">
          <!-- Global Search (Ctrl+K) -->
          <button class="icon-btn" onclick="GlobalSearchModule.open()" title="Search (Ctrl+K)">
            🔍
          </button>

          <!-- Notifications Bell -->
          <button class="icon-btn" id="notif-bell-btn" onclick="NotificationModule.toggleDropdown()" title="Notifications">
            🔔
            <span class="badge-dot notif-badge" id="notif-badge-dot"></span>
            <span class="notif-badge-count" id="notif-badge-count" style="
              position:absolute;
              top:-4px;
              right:-4px;
              background:var(--danger);
              color:white;
              width:18px;
              height:18px;
              border-radius:50%;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:0.6rem;
              font-weight:800;
              border:2px solid var(--bg-secondary);
            ">0</span>
          </button>

          <!-- Notification Dropdown -->
          <div id="notif-dropdown" class="notif-dropdown glass-panel" style="
            display:none;
            position:absolute;
            top:56px;
            right:160px;
            width:380px;
            max-height:450px;
            overflow:hidden;
            z-index:50;
          "></div>

          <!-- Notification Overlay -->
          <div id="notif-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:45;" onclick="NotificationModule.closeDropdown()"></div>

          <select id="plan-select" class="form-control plan-select" onchange="app.togglePlan(this.value)" title="Switch Pro / Premium plan">
            <option value="pro">Pro Plan</option>
            <option value="premium" selected>Premium Plan</option>
          </select>

          <button class="btn btn-secondary btn-sm" id="btn-patient-portal" onclick="app.navigateTo('patient-portal')" title="Launch Patient View">
            📱 Patient Portal
          </button>

          <button class="icon-btn" title="Toggle Light/Dark Theme" onclick="app.toggleTheme()">
            🌓
          </button>
          
          <button class="btn btn-secondary btn-sm" onclick="app.resetDemoData()" title="Reset Demo Data">
            🔄 Reset Demo
          </button>
        </div>
      </header>

      <main class="content-area">
        <div id="patients-module" class="page-view"></div>
        <div id="appointments-module" class="page-view"></div>
        <div id="calendar-module" class="page-view"></div>
        <div id="treatment-plan-module" class="page-view"></div>
        <div id="billing-module" class="page-view"></div>
        <div id="insurance-module" class="page-view"></div>
        <div id="inbox-module" class="page-view"></div>

        <div id="tooth-chart-module" class="page-view"></div>
        <div id="xray-module" class="page-view"></div>
        <div id="prescription-module" class="page-view"></div>
        <div id="inventory-module" class="page-view"></div>
        <div id="lab-module" class="page-view"></div>
        <div id="crm-module" class="page-view"></div>
        <div id="ai-assistant-module" class="page-view"></div>
        <div id="multi-clinic-module" class="page-view"></div>
        <div id="staff-module" class="page-view"></div>
        <div id="patient-portal-module" class="page-view"></div>
      </main>

    </div>

  <!-- Global Search Command Palette (Ctrl+K) -->
  <div id="search-palette"></div>

  <!-- Global Modal -->
  <div class="modal-overlay" id="global-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal Title</h3>
        <button class="close-btn" onclick="app.closeModal()">✕</button>
      </div>
      <div id="modal-body"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/seedData.js"></script>
  <script src="js/store.js"></script>
  <script src="js/planConfig.js"></script>

  <script src="js/modules/patients.js"></script>
  <script src="js/modules/appointments.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/treatmentPlan.js"></script>
  <script src="js/modules/billing.js"></script>
  <script src="js/modules/insurance.js"></script>

  <script src="js/modules/toothChart.js"></script>
  <script src="js/modules/xray.js"></script>
  <script src="js/modules/prescription.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/lab.js"></script>
  <script src="js/modules/crm.js"></script>
  <script src="js/modules/aiAssistant.js"></script>
  <script src="js/modules/multiClinic.js"></script>
  <script src="js/modules/staff.js"></script>
  <script src="js/modules/patientPortal.js"></script>

  <!-- New Enhancement Modules -->
  <script src="js/modules/notifications.js"></script>
  <script src="js/modules/globalSearch.js"></script>
  <script src="js/modules/inbox.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
